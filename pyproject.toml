[project]
name = "mlkv"
version = "0.1.0"
description = "Harness for measuring per-language damage of KV-cache and weight compression in LLMs"
readme = "README.md"
authors = [
    { name = "Anonymous Author", email = "anonymous@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fasttext-wheel>=0.9.2",   # GlotLID drift detector (works on Mac + CUDA box)
    "huggingface-hub>=1.27.0",
    "sacrebleu>=2.6.0",
    "sympy>=1.14.0",
    "torch>=2.13.0",
    # kvpress 0.5.4 (newest) supports transformers <5.3 only; its attention
    # hooks crash on 5.14 (KeyError: cache_position). Pin inside its range.
    "transformers>=5.0,<5.3",
]

# Compression backends for the CUDA box: `uv sync --extra cuda`.
# Plain `uv sync` REMOVES manually pip-installed packages — never install
# these by hand or a later sync will silently strip them (bitten once).
[project.optional-dependencies]
cuda = [
    "hqq>=0.2",           # HQQ cache backend for kv2h/kv4h
    "kvpress>=0.5.4",
    "optimum-quanto>=0.2",
]

[project.scripts]
mlkv = "mlkv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
