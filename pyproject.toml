[project]
name = "mlkv"
version = "0.1.0"
description = "Harness for measuring per-language damage of KV-cache and weight compression in LLMs"
readme = "README.md"
authors = [
    { name = "Anonymous Author", email = "anonymous@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "sacrebleu>=2.6.0",
    "sympy>=1.14.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[project.scripts]
mlkv = "mlkv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
